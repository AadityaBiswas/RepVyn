<meta charset="utf-8">
<title>Fatigue Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #eef0ec; --surface: #ffffff; --ink: #1b1f22; --muted: #5b6468; --line: #d9ddd7;
  --accent: #1f5fbf; --accent-ink: #ffffff; --track: #e3e6e1;
  --silhouette: #e1e4df; --region: #c9cec7; --sore: #d9480f;
  --ready: #2e8a57; --recovering: #c08310; --fatigued: #c8412e;
  --ready-bg: #e1f1e7; --recovering-bg: #f8ecd2; --fatigued-bg: #f8e1dc; --insight-bg: #e8effb;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111416; --surface: #1a1e21; --ink: #e7eae8; --muted: #9aa3a7; --line: #2b3135;
    --accent: #6f9df0; --accent-ink: #0d1420; --track: #262b2f;
    --silhouette: #252a2e; --region: #3a4146; --sore: #ff8a4c;
    --ready: #52c486; --recovering: #e3ab3d; --fatigued: #f06a55;
    --ready-bg: #173325; --recovering-bg: #3a2d10; --fatigued-bg: #3d1c17; --insight-bg: #18243a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111416; --surface: #1a1e21; --ink: #e7eae8; --muted: #9aa3a7; --line: #2b3135;
  --accent: #6f9df0; --accent-ink: #0d1420; --track: #262b2f;
  --silhouette: #252a2e; --region: #3a4146; --sore: #ff8a4c;
  --ready: #52c486; --recovering: #e3ab3d; --fatigued: #f06a55;
  --ready-bg: #173325; --recovering-bg: #3a2d10; --fatigued-bg: #3d1c17; --insight-bg: #18243a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 112px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 15px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
h2 { font-size: 30px; line-height: 1.1; }
h3 { font-size: 19px; }
p { margin: 0; }
.num, .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.top-actions { display: flex; align-items: center; gap: 4px; }
.intro { display: grid; gap: 6px; margin-bottom: 16px; }
.headline { font-size: 20px; line-height: 1.35; font-weight: 500; max-width: 42ch; text-wrap: pretty; }
.layout { display: grid; gap: 20px; }
@media (min-width: 880px) { .layout { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } }
.stack { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

select, input, button { font: inherit; color: inherit; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 48px; width: 100%; }
select.compact { width: auto; min-height: 40px; padding: 6px 10px; }
button { cursor: pointer; border: 0; border-radius: 12px; min-height: 44px; padding: 0 16px; font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary-btn { background: var(--accent); color: var(--accent-ink); }
.primary-btn:disabled { opacity: .45; cursor: not-allowed; }
.ghost { background: transparent; color: var(--accent); border: 1px dashed var(--line); width: 100%; }
.outline { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); width: 100%; min-height: 52px; font-size: 17px; }
.plain { background: transparent; color: var(--muted); padding: 0 8px; }
.icon { background: transparent; color: var(--muted); min-height: 36px; width: 36px; padding: 0; font-size: 16px; }
.icon:hover, .plain:hover { color: var(--ink); }
.small-x { font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* check-in */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { background: var(--bg); border: 1px solid var(--line); min-height: 40px; border-radius: 99px; font-weight: 500; }
.chip-btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ci-done { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* body map */
.bm { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 340px; width: 100%; margin: 0 auto; }
.bm-fig { margin: 0; display: grid; gap: 2px; }
.bm svg { width: 100%; height: auto; display: block; }
.bm figcaption { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.bm-n { fill: var(--silhouette); }
.bm-r { fill: var(--region); stroke: var(--surface); stroke-width: 1.5; transition: fill .2s ease; }
.bm-r.st-ready { fill: var(--ready); fill-opacity: .7; }
.bm-r.st-recovering { fill: var(--recovering); fill-opacity: .8; }
.bm-r.st-fatigued { fill: var(--fatigued); fill-opacity: .85; }
.bm-r.hot { stroke: var(--sore); stroke-width: 3; stroke-dasharray: 3 2; }
.bm-r[role="button"] { cursor: pointer; }
.bm-r[role="button"]:hover { fill: var(--muted); }
.bm-r.sel, .bm-r.sel:hover { fill: var(--sore); }
.bm-r:focus-visible { outline: none; stroke: var(--accent); stroke-width: 3; }
.key { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.key li { display: flex; align-items: center; gap: 6px; }
.key i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.key .st-ready { background: var(--ready); } .key .st-recovering { background: var(--recovering); } .key .st-fatigued { background: var(--fatigued); }
.key .hot-key { border: 2px dashed var(--sore); }

/* workout cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.card-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.sets { display: grid; }
.set { display: grid; gap: 8px; padding-block: 12px; border-top: 1px solid var(--line); }
.set-top { display: flex; align-items: center; gap: 10px; }
.set-n { min-width: 44px; font-weight: 600; font-size: 14px; }
.unit { color: var(--muted); flex: 1; font-size: 14px; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.step { width: 44px; min-height: 44px; border-radius: 0; background: var(--bg); font-size: 20px; padding: 0; }
.stepper input { width: 56px; border: 0; text-align: center; background: var(--surface); font-family: var(--mono); font-size: 18px; -moz-appearance: textfield; appearance: textfield; }
.stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.effort { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.eff { min-height: 48px; padding: 4px 2px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; display: grid; align-content: center; gap: 1px; line-height: 1.1; }
.eff b { font-size: 13px; font-weight: 600; }
.eff small { font-size: 11px; color: var(--muted); font-weight: 400; }
.eff.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.eff.on small { color: inherit; opacity: .85; }
.tag { justify-self: start; font-size: 13px; padding: 4px 10px; border-radius: 8px; background: var(--insight-bg); color: var(--ink); }

/* insights, plan, level */
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.insights li { background: var(--insight-bg); border-radius: 12px; padding: 10px 12px 10px 34px; position: relative; font-size: 15px; }
.insights li::before { content: ""; position: absolute; left: 13px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.plan-title { font-family: var(--display); font-size: 21px; font-weight: 700; }
.plan { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: ex; }
.plan > li { display: grid; gap: 3px; padding-top: 12px; border-top: 1px solid var(--line); counter-increment: ex; }
.plan-row { display: flex; justify-content: space-between; gap: 12px; }
.plan-row b::before { content: counter(ex) ". "; color: var(--muted); font-weight: 500; }
.plan-sets { font-family: var(--mono); font-size: 14px; }
.effort-word { font-family: var(--body); font-weight: 600; }
.why { font-size: 14px; color: var(--muted); }
.more summary { font-size: 13px; color: var(--accent); cursor: pointer; }
.more ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.lv-line { font-size: 18px; }
.levels { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.levels li { display: flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 99px; padding: 4px 6px 4px 12px; font-size: 14px; }
.lv { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface); }
.lv.beginner { color: var(--recovering); } .lv.intermediate { color: var(--accent); } .lv.advanced { color: var(--ready); }
.progress { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.slider { display: grid; gap: 6px; }
.slider input { width: 100%; accent-color: var(--accent); }

/* numbers (details) */
details.panel > summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: " ▸"; }
details.panel[open] > summary::after { content: " ▾"; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 22px; font-weight: 500; }
.tile .s { font-size: 12px; color: var(--muted); }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.bar-head { display: flex; align-items: center; gap: 8px; }
.bar-name { font-weight: 600; flex: 1; }
.pill { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.pill.ready { background: var(--ready-bg); color: var(--ready); }
.pill.recovering { background: var(--recovering-bg); color: var(--recovering); }
.pill.fatigued { background: var(--fatigued-bg); color: var(--fatigued); }
.track { position: relative; height: 8px; border-radius: 99px; background: var(--track); margin-top: 6px; overflow: hidden; }
.mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface); }
.mark.full { background: var(--ink); opacity: .55; }
.fill { height: 100%; border-radius: 99px; }
.fill.ready { background: var(--ready); } .fill.recovering { background: var(--recovering); } .fill.fatigued { background: var(--fatigued); }
.bar-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.legend { font-size: 12px; color: var(--muted); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); z-index: 5; }
.dock .primary-btn { width: 100%; max-width: 1008px; display: block; margin: 0 auto; font-size: 17px; min-height: 52px; }

/* tabs */
.tabs { display: flex; gap: 4px; background: var(--track); padding: 4px; border-radius: 12px; }
.tab { min-height: 36px; border-radius: 9px; background: transparent; color: var(--muted); padding: 0 14px; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.narrow { max-width: 640px; }
.outline-sm { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); }

/* per-exercise forecast, reps-left picker, verdicts, feedback */
.forecast { font-size: 14px; background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.rir { display: grid; gap: 6px; }
.rir-q { font-size: 13px; color: var(--muted); }
.rir-q b { color: var(--ink); }
.rir-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.rir-b { min-height: 44px; padding: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; font-family: var(--mono); font-size: 16px; font-weight: 500; }
.rir-b.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.verdict { font-size: 13px; font-weight: 600; }
.verdict.ok { color: var(--ready); } .verdict.up { color: var(--accent); } .verdict.down { color: var(--muted); }
.fb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
.chip-btn.pain.on { background: var(--fatigued); border-color: var(--fatigued); color: var(--surface); }

/* progress */
.hero { display: grid; gap: 4px; }
.hero-n { font-family: var(--display); font-size: 44px; font-weight: 700; line-height: 1; }
.chart { width: 100%; max-width: 420px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.chart .bar { fill: var(--accent); }
.chart .hit:hover .bar { fill-opacity: .8; }
.traits { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.traits li { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.traits li:last-child { border-bottom: 0; padding-bottom: 0; }
.trait-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.conf { font-size: 12px; color: var(--muted); }
.conf.high, .conf.medium { color: var(--ready); }
.strength { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.strength li { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.spark { width: 132px; height: 40px; flex: none; }
.spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.spark .end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.vol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.vol li { display: grid; grid-template-columns: 9.5em 1fr 3.2em; align-items: center; gap: 8px; }
.vol-n { font-size: 14px; }
.vol-track { position: relative; height: 10px; background: var(--track); border-radius: 99px; }
.vol-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; max-width: 100%; }
.vol-track b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.hero-n small { font-size: 18px; font-weight: 600; color: var(--muted); }
.kcal-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.kcal-list li { display: flex; justify-content: space-between; gap: 12px; }
.body-form { display: grid; gap: 10px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fields label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.fields label span { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.fields input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); font-family: var(--mono); }
.fields select { min-height: 44px; }
#tip { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 13px; padding: 6px 9px; border-radius: 8px; max-width: 260px; }
@media (prefers-reduced-motion: reduce) { .bm-r { transition: none; } }
</style>

<div class="wrap">
  <div class="top">
    <h1>Fatigue Lab</h1>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" id="tab-train" role="tab" aria-selected="true">Train</button>
      <button class="tab" id="tab-progress" role="tab" aria-selected="false">Progress</button>
    </div>
    <div class="top-actions">
      <label for="prog" class="sr">Program</label>
      <select id="prog" class="compact"></select>
      <button id="reset" class="plain">Start over</button>
    </div>
  </div>

  <div id="view-workout" class="narrow">
    <div class="intro">
      <h2 id="wtitle">Workout 1</h2>
      <p id="wsub" class="muted"></p>
    </div>
    <div class="stack">
      <section id="checkin" class="panel"></section>
      <button id="fill" class="outline">Fill in today's plan</button>
      <label for="pick" class="sr">Add an exercise</label>
      <select id="pick"></select>
      <div id="entries" class="stack"></div>
    </div>
    <div class="dock"><button id="finish" class="primary-btn">Finish workout</button></div>
  </div>

  <div id="view-results" hidden>
    <div class="intro">
      <h2 id="rtitle">Done</h2>
      <p id="rhead" class="headline"></p>
    </div>
    <div class="layout">
      <div class="stack">
        <div class="panel">
          <div id="rmap"></div>
          <div class="slider">
            <label for="hours" class="label">See how you'll feel later</label>
            <input id="hours" type="range" min="0" max="96" step="1" value="0">
            <span id="hours-out" class="muted small"></span>
          </div>
        </div>
        <div class="panel"><span class="label">Calories</span><div id="rcal" class="stack"></div></div>
        <div id="rinsights-box" class="panel"><span class="label">What I learned today</span><div id="rinsights"></div></div>
        <div class="panel"><span class="label">Soreness forecast</span><p id="rsore"></p></div>
        <details class="panel"><summary>Show the numbers</summary><div id="rnumbers" class="stack"></div></details>
      </div>
      <aside class="stack">
        <div class="panel">
          <span class="label">Next workout</span>
          <div id="rplan" class="stack"></div>
          <div class="actions">
            <button id="use-plan" class="primary-btn">Start this workout</button>
            <button id="next" class="plain">Log my own workout instead</button>
          </div>
        </div>
        <div class="actions">
          <button id="edit" class="plain">Edit this workout</button>
          <button id="reset2" class="plain">Start over</button>
        </div>
      </aside>
    </div>
  </div>

  <div id="view-progress" hidden>
    <div class="intro">
      <h2>What I know about you</h2>
      <p id="p-count" class="muted"></p>
    </div>
    <div class="layout">
      <div class="stack">
        <div class="panel"><span class="label">How well I predict you</span><div id="p-acc" class="stack"></div></div>
        <div class="panel"><span class="label">Strength</span><div id="p-strength"></div></div>
        <div class="panel"><span class="label">This week</span><div id="p-week" class="stack"></div></div>
      </div>
      <aside class="stack">
        <div class="panel"><span class="label">About you</span><div id="p-about"></div></div>
        <div class="panel"><span class="label">Your level</span><div id="p-level" class="stack"></div></div>
      </aside>
    </div>
  </div>
</div>
<div id="tip" role="tooltip" hidden></div>

<script>/*APP*/</script>
