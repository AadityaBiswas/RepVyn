<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RepVyn: in a set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="kit/device.css">
<style>
.set { --ink: #1C1C1E; --ink-2: rgba(28,28,30,.68); --accent: #D91E36; --geist: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  font-family: var(--geist); color: var(--ink); background: #A6A6A6; font-variant-numeric: tabular-nums; }
.ac-status { font-family: "Geist", system-ui, sans-serif !important; }
.set button { margin: 0; padding: 0; border: 0; font: inherit; color: inherit; cursor: pointer; }
.set .ic { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.set ::selection { background: rgba(217,30,54,.22); }
.set :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.press { transition: transform 100ms ease-out; }
.press:active { transform: scale(.97); }

/* The clip is fitted to the width so the whole movement shows above the panel; the floor colour carries on below it. */
.video { position: absolute; left: 0; top: -52px; width: 100%; }
.scrim { position: absolute; inset: 0 0 auto; height: 176px; background: linear-gradient(rgba(0,0,0,.44), transparent); }

/* One material for everything that floats over the clip: bright frosted glass, lit from the top edge. */
.frost { background: rgba(255,255,255,.8); -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 12px 24px -14px rgba(0,0,0,.4); }

.top { position: absolute; left: 16px; right: 16px; top: 64px; display: flex; align-items: center; gap: 14px; }
.chip { height: 44px; min-width: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.clock { padding: 0 14px; font: 600 15px/1 var(--mono); }
.bar { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.bar i { height: 4px; border-radius: 99px; background: rgba(255,255,255,.4); overflow: hidden; }
.bar b { display: block; height: 100%; border-radius: 99px; background: #FFFFFF; }

/* The bigger surface is the thicker one: more blur, a deeper shadow. Radius is concentric with the display corner. */
.panel { position: absolute; left: 16px; right: 16px; bottom: 28px; padding: 16px 20px; border-radius: 39px; display: flex; flex-direction: column;
  -webkit-backdrop-filter: blur(44px) saturate(1.8); backdrop-filter: blur(44px) saturate(1.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 36px 64px -30px rgba(0,0,0,.6); }
.what { display: flex; align-items: center; gap: 12px; }
.muscle { width: 48px; height: 48px; flex: none; border-radius: 14px; background: #F2F2F7; }
/* The sets of this exercise, in the same code as the program bar: done is ink, now is red. */
.sets { margin-left: auto; align-self: flex-start; padding-top: 8px; display: flex; gap: 4px; }
.sets i { width: 18px; height: 5px; border-radius: 99px; background: rgba(28,28,30,.14); }
.sets i.d { background: var(--ink); }
.sets i.n { background: var(--accent); }
.what h1 { margin: 0; font-size: 28px; line-height: 1; font-weight: 800; letter-spacing: -.035em; }
.what p { margin: 5px 0 0; font-size: 13px; line-height: 1.2; font-weight: 600; color: var(--ink-2); }

.count { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
.count b { margin-left: -4px; font-size: 104px; line-height: .86; font-weight: 800; letter-spacing: -.04em; }
.count p { align-self: flex-end; margin: 0 0 12px; display: flex; flex-direction: column; gap: 1px; white-space: nowrap; font-size: 15px; line-height: 1.2; font-weight: 500; color: var(--ink-2); }
.count strong { font-size: 17px; font-weight: 700; letter-spacing: -.015em; color: var(--ink); }
.stepper { margin-left: auto; display: flex; align-items: center; border-radius: 999px; background: rgba(28,28,30,.07); }
.stepper button { width: 52px; height: 56px; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center; }
.stepper i { width: 1px; height: 22px; background: rgba(0,0,0,.12); }

.done { width: 100%; height: 64px; border-radius: 999px; background: var(--accent); display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 8px 16px -10px rgba(217,30,54,.7); }
.set .done { margin-top: 12px; color: #FFFFFF; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }

@media (prefers-reduced-transparency: reduce) { .frost { background: #FFFFFF; -webkit-backdrop-filter: none; backdrop-filter: none; } }
@media (prefers-reduced-motion: reduce) { .press { transition: none; } }
</style>
</head>
<body>

<section class="screen set" data-name="set" data-chrome="light" data-home="dark" data-time="7:44">
  <img class="video" src="img/split-squat-clean.jpg" alt="">
  <div class="scrim"></div>
  <div class="top">
    <button type="button" class="chip frost press" aria-label="End workout"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div class="bar" role="img" aria-label="Exercise 1 of 5"><i><b style="width: 33.3%"></b></i><i></i><i></i><i></i><i></i></div>
    <span class="chip clock frost">02:10</span>
  </div>
  <div class="panel frost">
    <div class="what">
      <img class="muscle" src="img/thumb-quads-light.png" alt="">
      <div><h1>Split squat</h1><p>Set 2 of 3</p></div>
      <div class="sets" aria-hidden="true"><i class="d"></i><i class="n"></i><i></i></div>
    </div>
    <div class="count">
      <b>10</b>
      <p><strong>reps</strong>each side</p>
      <div class="stepper">
        <button type="button" class="press" aria-label="One rep fewer"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" stroke-width="2.4" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
        <i></i>
        <button type="button" class="press" aria-label="One rep more"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" stroke-width="2.4" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg></button>
      </div>
    </div>
    <button type="button" class="done press"><svg width="22" height="22" viewBox="0 0 24 24" class="ic" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Set done</button>
  </div>
</section>

<script src="kit/device.js"></script>
</body>
</html>
